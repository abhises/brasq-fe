name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one deploy at a time; a newer push waits instead of cancelling a release halfway
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-web' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: brasq-web:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test image
        run: |
          docker load -i ${{ runner.temp }}/image.tar
          docker run -d --name web -p 3999:3000 -e BACKEND_URL=http://127.0.0.1:9 ${{ env.IMAGE }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/api/health && exit 0; sleep 2; done
          docker logs web; exit 1

      - name: Save image
        if: github.event_name != 'pull_request'
        run: gzip -1 -c ${{ runner.temp }}/image.tar > ${{ runner.temp }}/image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER || 'ubuntu' }}" > ~/.ssh/config

      - name: Upload image
        run: scp -q image.tar.gz prod:brasq/incoming/web-${{ github.sha }}.tar.gz

      - name: Release (blue/green, auto-rollback on failed health check)
        id: release
        run: |
          ssh prod "set -e
            gunzip -c ~/brasq/incoming/web-${{ github.sha }}.tar.gz | docker load -q
            rm -f ~/brasq/incoming/web-${{ github.sha }}.tar.gz
            ~/brasq/infra/brasq-release deploy web ${{ env.IMAGE }}"

      - name: Verify through nginx
        id: verify
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://brasq.com/api/health
          curl -fsS -o /dev/null --retry 3 https://brasq.com/

      - name: Roll back if the live check failed
        if: failure() && steps.release.outcome == 'success'
        run: ssh prod "~/brasq/infra/brasq-release rollback web"
